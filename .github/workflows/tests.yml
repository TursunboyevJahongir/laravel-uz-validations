name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        laravel: ['10.*', '11.*']
        include:
          - laravel: '10.*'
            testbench: '^8.0'
          - laravel: '11.*'
            testbench: '^9.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: xdebug
      - name: Validate package metadata
        run: composer validate --strict
      - name: Select compatibility target
        run: composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
      - name: Install compatibility test dependencies
        # Laravel 10/11 are end-of-life. The exception is limited to this test job;
        # package consumers retain their own Composer security policy.
        run: composer update --prefer-dist --no-interaction --no-progress --no-security-blocking
      - name: Style
        run: composer format:check
      - name: Test rules and Laravel integration
        run: composer test:coverage
      - name: Record dependency audit
        if: always()
        continue-on-error: true
        run: composer audit --format=json > dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-php${{ matrix.php }}-laravel${{ matrix.laravel }}
          path: |
            build/coverage.xml
            dependency-audit.json
            composer.lock
